name: Verify release artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify local release contract
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run check-assets
          npm run release:preflight
          npm run test:package
          HUI_REF="${{ github.ref_name }}" node bin/install.js --help
          python - <<'PY'
          import hashlib
          from pathlib import Path
          hooks = Path('src/hooks')
          # checksums.sha256 is "<digest>  <name>" per line; build {name: digest}
          # so the loop below keys on the FILENAME, not the hex digest (a prior
          # dict() form reversed these and tried to read a file named after the
          # digest → FileNotFoundError). Normalize CRLF→LF before hashing so the
          # check holds on both LF (CI) and CRLF (Windows local) checkouts — the
          # committed manifest stores LF digests, same as release_preflight.py.
          def _lf(b):
              return b.replace(b'\r\n', b'\n').replace(b'\r', b'\n')
          manifest = {}
          for line in (hooks / 'checksums.sha256').read_text().splitlines():
            line = line.strip()
            if not line:
              continue
            digest, name = line.split(maxsplit=1)
            manifest[name] = digest
          for name, digest in manifest.items():
              actual = hashlib.sha256(_lf((hooks / name).read_bytes())).hexdigest()
              if actual != digest:
                  raise SystemExit(f'checksum mismatch: {name}')
          print('Tagged checkout checksum manifest verified')
          PY
      - name: Verify remote hooks match tag manifest
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/everything-ok/next-token/${REF}/src/hooks"
          curl --fail-with-body --retry 3 --retry-all-errors -sSLO "${base}/checksums.sha256"
          while read -r digest name; do
            curl --fail-with-body --retry 3 --retry-all-errors -sS "${base}/${name}" | sha256sum -c - <<<"${digest}  -"
          done < checksums.sha256
      - name: Verify bootstrap contracts
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/everything-ok/next-token/${REF}"
          curl --fail-with-body --retry 3 --retry-all-errors -sS "${base}/install.sh" | grep -F 'next-token'
          curl --fail-with-body --retry 3 --retry-all-errors -sS "${base}/install.ps1" | grep -F 'next-token'
